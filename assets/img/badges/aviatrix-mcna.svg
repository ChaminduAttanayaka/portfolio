<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 340" width="340" height="340">
  <defs>
    <linearGradient id="av-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141419" />
      <stop offset="50%" stop-color="#241E1E" />
      <stop offset="100%" stop-color="#0E0E12" />
    </linearGradient>
    <linearGradient id="av-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B2B" />
      <stop offset="50%" stop-color="#FF4F00" />
      <stop offset="100%" stop-color="#C23B00" />
    </linearGradient>
    <linearGradient id="av-banner" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C23B00" />
      <stop offset="50%" stop-color="#FF4F00" />
      <stop offset="100%" stop-color="#C23B00" />
    </linearGradient>
    <filter id="av-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Outer Hexagon Shadow & Fill -->
  <polygon points="170,12 315,95 315,245 170,328 25,245 25,95" fill="url(#av-bg)" stroke="url(#av-border)" stroke-width="7" filter="url(#av-shadow)" stroke-linejoin="round" />

  <!-- Inner Hexagon Accent Line -->
  <polygon points="170,24 300,99 300,237 170,312 40,237 40,99" fill="none" stroke="rgba(255,79,0,0.2)" stroke-width="1.5" stroke-dasharray="6,4" />

  <!-- Aviatrix Logo Icon -->
  <g transform="translate(170, 70) scale(0.95)">
    <!-- Wings / Dynamic Network Nodes -->
    <path d="M-28,-8 L-8,-18 L0,-4 L8,-18 L28,-8 L18,8 L0,18 L-18,8 Z" fill="none" stroke="#FF4F00" stroke-width="3.5" stroke-linejoin="round" />
    <circle cx="0" cy="0" r="5" fill="#FFFFFF" />
    <circle cx="-18" cy="-5" r="3.5" fill="#FF8C42" />
    <circle cx="18" cy="-5" r="3.5" fill="#FF8C42" />
  </g>

  <!-- Aviatrix Certified Header -->
  <text x="170" y="118" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="12" fill="#FF8C42" letter-spacing="2">AVIATRIX CERTIFIED</text>

  <!-- Multi-Cloud Title -->
  <text x="170" y="152" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="19" fill="#FFFFFF" letter-spacing="-0.5">Multi-Cloud</text>
  <text x="170" y="176" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="19" fill="#FFFFFF" letter-spacing="-0.5">Network</text>

  <!-- Associate Banner -->
  <g transform="translate(170, 226)">
    <polygon points="-90,-16 90,-16 80,16 -80,16" fill="url(#av-banner)" stroke="#FF8C42" stroke-width="1.5" />
    <text x="0" y="5" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="14" fill="#FFFFFF" letter-spacing="2">ASSOCIATE</text>
  </g>

  <!-- Verified Mark -->
  <circle cx="170" cy="278" r="13" fill="#2E1208" stroke="#FF4F00" stroke-width="2" />
  <path d="M165,278 L169,282 L176,274" fill="none" stroke="#FF8C42" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
