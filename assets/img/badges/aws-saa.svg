<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 340" width="340" height="340">
  <defs>
    <linearGradient id="saa-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0A192F" />
    </linearGradient>
    <linearGradient id="saa-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="saa-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#FF9900" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="saa-assoc-banner" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0369A1" />
      <stop offset="50%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <filter id="saa-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Outer Hexagon Shadow & Fill -->
  <polygon points="170,12 315,95 315,245 170,328 25,245 25,95" fill="url(#saa-bg)" stroke="url(#saa-border)" stroke-width="7" filter="url(#saa-shadow)" stroke-linejoin="round" />

  <!-- Inner Hexagon Accent Line -->
  <polygon points="170,24 300,99 300,237 170,312 40,237 40,99" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" stroke-dasharray="6,4" />

  <!-- AWS Logo Header -->
  <g transform="translate(170, 72) scale(0.9)">
    <text x="0" y="0" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" letter-spacing="1">aws</text>
    <!-- AWS Smile Arrow -->
    <path d="M-28,8 Q0,24 28,8" fill="none" stroke="url(#saa-gold)" stroke-width="3.5" stroke-linecap="round" />
    <path d="M22,5 L29,8 L25,15" fill="url(#saa-gold)" />
  </g>

  <!-- Certified Label -->
  <text x="170" y="112" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="13" fill="url(#saa-gold)" letter-spacing="3">CERTIFIED</text>

  <!-- Solutions Architect Main Title -->
  <text x="170" y="152" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="21" fill="#FFFFFF" letter-spacing="-0.5">Solutions</text>
  <text x="170" y="178" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="21" fill="#FFFFFF" letter-spacing="-0.5">Architect</text>

  <!-- Associate Banner Ribbon -->
  <g transform="translate(170, 236)">
    <polygon points="-98,-18 98,-18 88,18 -88,18" fill="url(#saa-assoc-banner)" stroke="#38BDF8" stroke-width="1.5" />
    <text x="0" y="6" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="14" fill="#FFFFFF" letter-spacing="2.5">ASSOCIATE</text>
  </g>

  <!-- Verified Mark -->
  <circle cx="170" cy="278" r="14" fill="#0C4A6E" stroke="url(#saa-gold)" stroke-width="2" />
  <path d="M165,278 L169,282 L176,274" fill="none" stroke="url(#saa-gold)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
