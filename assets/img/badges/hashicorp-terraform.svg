<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 340" width="340" height="340">
  <defs>
    <linearGradient id="tf-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E121B" />
      <stop offset="50%" stop-color="#1A1C29" />
      <stop offset="100%" stop-color="#0A0D14" />
    </linearGradient>
    <linearGradient id="tf-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#844FBA" />
      <stop offset="50%" stop-color="#5C4EE5" />
      <stop offset="100%" stop-color="#4034B2" />
    </linearGradient>
    <linearGradient id="tf-banner" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5C4EE5" />
      <stop offset="50%" stop-color="#844FBA" />
      <stop offset="100%" stop-color="#5C4EE5" />
    </linearGradient>
    <filter id="tf-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Outer Hexagon Shadow & Fill -->
  <polygon points="170,12 315,95 315,245 170,328 25,245 25,95" fill="url(#tf-bg)" stroke="url(#tf-border)" stroke-width="7" filter="url(#tf-shadow)" stroke-linejoin="round" />

  <!-- Inner Hexagon Accent Line -->
  <polygon points="170,24 300,99 300,237 170,312 40,237 40,99" fill="none" stroke="rgba(132,79,186,0.25)" stroke-width="1.5" stroke-dasharray="6,4" />

  <!-- Terraform Isometric Blocks -->
  <g transform="translate(170, 78) scale(0.85)">
    <!-- Top-Left Block -->
    <path d="M-22,-30 L-6,-21 L-6, -1 L-22,-10 Z" fill="#844FBA" opacity="0.9" />
    <!-- Top-Right Block -->
    <path d="M-4,-20 L12,-29 L12,-9 L-4,0 Z" fill="#635BFF" />
    <!-- Bottom-Left Block -->
    <path d="M-22,-8 L-6,1 L-6,21 L-22,12 Z" fill="#5C4EE5" />
    <!-- Bottom-Right Block -->
    <path d="M-4,3 L12,-6 L12,14 L-4,23 Z" fill="#00D4B2" />
  </g>

  <!-- HashiCorp Certified Title -->
  <text x="170" y="128" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="12" fill="#A78BFA" letter-spacing="2">HASHICORP CERTIFIED</text>

  <!-- Terraform Title -->
  <text x="170" y="164" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="26" fill="#FFFFFF" letter-spacing="-0.5">Terraform</text>

  <!-- Associate Banner -->
  <g transform="translate(170, 222)">
    <polygon points="-90,-16 90,-16 80,16 -80,16" fill="url(#tf-banner)" stroke="#A78BFA" stroke-width="1.5" />
    <text x="0" y="5" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="13" fill="#FFFFFF" letter-spacing="2">ASSOCIATE (003)</text>
  </g>

  <!-- Verified Mark -->
  <circle cx="170" cy="276" r="13" fill="#1F1735" stroke="#A78BFA" stroke-width="2" />
  <path d="M165,276 L169,280 L176,272" fill="none" stroke="#A78BFA" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
