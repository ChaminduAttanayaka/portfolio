<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 340" width="340" height="340">
  <defs>
    <linearGradient id="csc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081A24" />
      <stop offset="50%" stop-color="#0B2D3E" />
      <stop offset="100%" stop-color="#04121A" />
    </linearGradient>
    <linearGradient id="csc-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#00BCEB" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="csc-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Outer Hexagon Shadow & Fill -->
  <polygon points="170,12 315,95 315,245 170,328 25,245 25,95" fill="url(#csc-bg)" stroke="url(#csc-border)" stroke-width="7" filter="url(#csc-shadow)" stroke-linejoin="round" />

  <!-- Inner Accent Line -->
  <polygon points="170,24 300,99 300,237 170,312 40,237 40,99" fill="none" stroke="rgba(0,188,235,0.2)" stroke-width="1.5" stroke-dasharray="6,4" />

  <!-- Cisco Iconic Bridge Bars -->
  <g transform="translate(170, 72) scale(1.1)">
    <!-- 9 Bridge waveform vertical lines -->
    <line x1="-32" y1="6" x2="-32" y2="16" stroke="#00BCEB" stroke-width="3.5" stroke-linecap="round" />
    <line x1="-24" y1="-2" x2="-24" y2="16" stroke="#00BCEB" stroke-width="3.5" stroke-linecap="round" />
    <line x1="-16" y1="-10" x2="-16" y2="16" stroke="#00BCEB" stroke-width="3.5" stroke-linecap="round" />
    <line x1="-8" y1="-2" x2="-8" y2="16" stroke="#00BCEB" stroke-width="3.5" stroke-linecap="round" />
    <line x1="0" y1="-18" x2="0" y2="16" stroke="#00BCEB" stroke-width="3.5" stroke-linecap="round" />
    <line x1="8" y1="-2" x2="8" y2="16" stroke="#00BCEB" stroke-width="3.5" stroke-linecap="round" />
    <line x1="16" y1="-10" x2="16" y2="16" stroke="#00BCEB" stroke-width="3.5" stroke-linecap="round" />
    <line x1="24" y1="-2" x2="24" y2="16" stroke="#00BCEB" stroke-width="3.5" stroke-linecap="round" />
    <line x1="32" y1="6" x2="32" y2="16" stroke="#00BCEB" stroke-width="3.5" stroke-linecap="round" />
  </g>

  <!-- Cisco Label -->
  <text x="170" y="118" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="14" fill="#38BDF8" letter-spacing="3">CISCO</text>

  <!-- CCNA Main Title -->
  <text x="170" y="156" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" letter-spacing="1">CCNA</text>

  <!-- Introduction to Networks -->
  <text x="170" y="184" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="13" fill="#E2E8F0">Introduction to Networks</text>

  <!-- Verified Badge Ribbon -->
  <g transform="translate(170, 226)">
    <polygon points="-90,-16 90,-16 80,16 -80,16" fill="#0369A1" stroke="#38BDF8" stroke-width="1.5" />
    <text x="0" y="5" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="12" fill="#FFFFFF" letter-spacing="2">NETWORKING</text>
  </g>

  <!-- Verified Mark -->
  <circle cx="170" cy="278" r="13" fill="#082F49" stroke="#00BCEB" stroke-width="2" />
  <path d="M165,278 L169,282 L176,274" fill="none" stroke="#00BCEB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
